name: SalesOS build and database checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seebot
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: seebot_salesos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seebot -d seebot_salesos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://seebot:ci_only_password@localhost:5432/seebot_salesos?schema=public
      JWT_SECRET: CI_ONLY_RANDOM_TEST_SECRET_NOT_FOR_PRODUCTION_0123456789
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_PORT: "4000"
      NODE_ENV: test
      SIGNING_ENABLED: "false"
      GMAIL_SENDING_ENABLED: "false"
      SURVEYS_ENABLED: "false"
      TENANT_SCOPED_CRM_PREVIEW: "false"
      SEED_DEMO_DATA: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install monorepo dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Prisma's fast-check dependency
        run: node -e "require('fast-check'); console.log('fast-check dependency OK')"
      - name: Build shared types
        run: npm run build -w @seebot/shared
      - name: Validate Prisma schema
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma
      - name: Generate SQL baseline for migration review (never apply to a live database)
        run: |
          mkdir -p artifacts/database
          npx prisma migrate diff --from-empty --to-schema-datamodel packages/database/prisma/schema.prisma --script > artifacts/database/schema-baseline-review.sql
          test -s artifacts/database/schema-baseline-review.sql
      - name: Upload review-only schema baseline
        uses: actions/upload-artifact@v4
        with:
          name: salesos-database-schema-review
          path: artifacts/database/schema-baseline-review.sql
          retention-days: 7
      - name: Rehearse migration upgrade and backup restoration on disposable PostgreSQL
        env:
          PG_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/migration-rehearsal.cjs
      - name: Deploy versioned schema to disposable PostgreSQL test database
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and policy tests
        run: npm run test
      - name: Build API and Next.js frontend
        run: npm run build
      - name: Independently verify signing evidence and tampering
        run: node scripts/test-signing-evidence.cjs
      - name: Cross-tenant API isolation over HTTP
        run: node scripts/tenant-isolation-e2e.cjs
      - name: Complete tenant sales lifecycle and P0 security regressions
        run: node scripts/saas-p0-e2e.cjs
      - name: Organization operations, durable worker and exports
        run: node scripts/saas-operations-e2e.cjs
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Browser E2E for company onboarding and finance
        run: node scripts/browser-e2e.cjs
      - name: Save real browser screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesos-consolidated-browser-screens
          path: artifacts/salesos-e2e-screens/
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm pending real-world security gates
        run: |
          test "$SIGNING_ENABLED" = false
          test "$TENANT_SCOPED_CRM_PREVIEW" = false
          echo "Real signing and tenant preview remain disabled in CI."

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seebot
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: salesos_container_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seebot -d salesos_container_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://seebot:ci_only_password@127.0.0.1:5432/salesos_container_ci?schema=public
      JWT_SECRET: CI_ONLY_CONTAINER_SECRET_NOT_FOR_PRODUCTION_0123456789
      MFA_CODE_SECRET: CI_ONLY_CONTAINER_MFA_SECRET_NOT_FOR_PRODUCTION_0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Build migration and non-root runtime images
        run: |
          docker build --target build --build-arg API_INTERNAL_URL=http://127.0.0.1:4000 -t salesos-ci-migrate .
          docker build --target runtime --build-arg API_INTERNAL_URL=http://127.0.0.1:4000 -t salesos-ci-runtime .
      - name: Migrate disposable database
        run: docker run --rm --network host -e DATABASE_URL salesos-ci-migrate npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma
      - name: Start non-root API, web and worker
        run: |
          docker run -d --name salesos-api --network host --read-only --tmpfs /tmp -e DATABASE_URL -e JWT_SECRET -e MFA_CODE_SECRET -e CORS_ORIGIN=https://container-ci.example salesos-ci-runtime node apps/api/dist/main.js
          docker run -d --name salesos-web --network host --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache:uid=1000,gid=1000 salesos-ci-runtime npm run start -w @seebot/web
          docker run -d --name salesos-worker --network host --read-only --tmpfs /tmp -e DATABASE_URL salesos-ci-runtime node apps/api/dist/worker.js
      - name: Observe readiness, web proxy and worker preparation
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:4000/ready
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:3000/login > /tmp/salesos-login.html
          test "$(curl -s -o /tmp/salesos-unauthorized.json -w '%{http_code}' http://127.0.0.1:3000/api/workspaces)" = 401
          test "$(docker inspect -f '{{.State.Running}}' salesos-worker)" = true
          docker run --rm --network host -e DATABASE_URL salesos-ci-runtime node -e 'const {PrismaClient}=require("@prisma/client");const db=new PrismaClient();(async()=>{for(let i=0;i<30;i++){if(await db.backgroundJob.count({where:{kind:"MAINTENANCE",status:"SUCCEEDED"}})){await db.$disconnect();return;}await new Promise(r=>setTimeout(r,1000));}throw Error("Worker did not complete maintenance");})().catch(e=>{console.error(e);process.exit(1)})'
      - name: Container logs
        if: always()
        run: |
          docker logs salesos-api || true
          docker logs salesos-web || true
          docker logs salesos-worker || true
      - name: Stop containers
        if: always()
        run: docker rm -f salesos-api salesos-web salesos-worker || true
